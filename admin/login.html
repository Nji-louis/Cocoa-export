<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COCOABRIDGE Admin Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#2c1810,#8a5a00);
      font-family:Segoe UI,Tahoma,sans-serif;
    }

    .login-card{
      width:100%;
      max-width:420px;
      background:#fff;
      border-radius:20px;
      padding:40px 34px;
      box-shadow:0 20px 50px rgba(0,0,0,.25);
    }

    .logo{
      text-align:center;
      margin-bottom:26px;
    }

    .logo i{
      font-size:56px;
      color:#8a5a00;
    }

    .logo h2{
      margin-top:10px;
      font-weight:700;
      color:#2c1810;
    }

    .btn-brand{
      background:#8a5a00;
      border:none;
      color:#fff;
      font-weight:600;
      padding:12px;
      border-radius:12px;
    }

    .btn-brand:hover{
      background:#6f4800;
      color:#fff;
    }

    .form-control{
      border-radius:12px;
      padding:12px;
    }

    #message{
      min-height:24px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      <i class="fa fa-seedling"></i>
      <h2>COCOABRIDGE</h2>
      <p class="text-muted mb-0">Administrator Portal</p>
    </div>

    <form id="loginForm">

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email"
               id="email"
               class="form-control"
               placeholder="info@cocoabridge.com"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password"
               id="password"
               class="form-control"
               placeholder="••••••••••"
               required>
      </div>

      <button type="submit" class="btn btn-brand w-100" id="loginBtn">
        <i class="fa fa-sign-in-alt me-2"></i>Login
      </button>

    </form>

    <p id="message" class="text-danger text-center mt-3"></p>

  </div>

<script>
const API_BASE = 'http://localhost:5000/api';

document.getElementById('loginForm').addEventListener('submit', async (e) => {

  e.preventDefault();

  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('message');

  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>Signing in...';
  msg.textContent = '';

  try {

    const response = await fetch(`${API_BASE}/auth/login`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });

    const data = await response.json();

    if (data.success) {

      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminId', data.admin.id);
      localStorage.setItem('adminName', data.admin.name);
      localStorage.setItem('adminEmail', data.admin.email);

      window.location.href = 'dashboard.html';

    } else {

      msg.textContent = data.message || 'Login failed';
    }

  } catch (err) {

    console.error(err);
    msg.textContent = 'Unable to connect to the server';

  } finally {

    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-sign-in-alt me-2"></i>Login';
  }
});
</script>

</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const API_BASE = 'https://api.cocoabridge.com/api';
const token = localStorage.getItem('adminToken');

if(!token){
  window.location.href = 'login.html';
}

let faqs = [];
let editingId = null;

const faqModal = new bootstrap.Modal(document.getElementById('faqModal'));

async function loadFaqs(){

  try{

    const res = await fetch(`${API_BASE}/faqs/admin/all`,{
      headers:{ Authorization:`Bearer ${token}` }
    });

    const data = await res.json();

    if(data.success){
      faqs = data.faqs || [];
      renderFaqs(faqs);
      updateStats();
    }

  }catch(err){
    console.error(err);
    alert('Failed to load FAQs');
  }
}

function updateStats(){

  document.getElementById('totalCount').textContent = faqs.length;

  document.getElementById('activeCount').textContent =
    faqs.filter(f=>f.status==='active').length;

  document.getElementById('inactiveCount').textContent =
    faqs.filter(f=>f.status==='inactive').length;
}

function renderFaqs(list){

  const tbody = document.getElementById('faqTable');

  if(!list.length){
    tbody.innerHTML='<tr><td colspan="6" class="text-center py-4">No FAQs found</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(faq=>`

    <tr>

      <td><strong>${faq.question}</strong></td>

      <td>${faq.category || 'General'}</td>

      <td><div class="faq-preview">${faq.answer}</div></td>

      <td>${faq.sort_order ?? 0}</td>

      <td>
        <span class="badge ${faq.status==='active'?'badge-active':'badge-inactive'}">
          ${faq.status}
        </span>
      </td>

      <td class="text-end">

        <button class="btn btn-sm btn-outline-primary me-1"
                onclick="openEditModal(${faq.id})">
          <i class="fa fa-pen"></i>
        </button>

        <button class="btn btn-sm btn-outline-danger"
                onclick="deleteFaq(${faq.id})">
          <i class="fa fa-trash"></i>
        </button>

      </td>

    </tr>

  `).join('');
}

document.getElementById('searchInput').addEventListener('input', function(){

  const q = this.value.toLowerCase();

  const filtered = faqs.filter(f=>
    (f.question||'').toLowerCase().includes(q) ||
    (f.answer||'').toLowerCase().includes(q) ||
    (f.category||'').toLowerCase().includes(q)
  );

  renderFaqs(filtered);
});

function openAddModal(){

  editingId = null;

  document.getElementById('modalTitle').textContent = 'Add FAQ';

  document.getElementById('faqForm').reset();

  document.getElementById('sort_order').value = 1;

  document.getElementById('status').value = 'active';

  faqModal.show();
}

function openEditModal(id){

  const faq = faqs.find(f=>f.id==id);

  if(!faq) return;

  editingId = id;

  document.getElementById('modalTitle').textContent = 'Edit FAQ';

  document.getElementById('faqId').value = faq.id;
  document.getElementById('question').value = faq.question;
  document.getElementById('answer').value = faq.answer;
  document.getElementById('category').value = faq.category || '';
  document.getElementById('sort_order').value = faq.sort_order ?? 0;
  document.getElementById('status').value = faq.status;

  faqModal.show();
}

document.getElementById('faqForm').addEventListener('submit', async function(e){

  e.preventDefault();

  const saveBtn = document.getElementById('saveBtn');

  saveBtn.disabled = true;

  try{

    const payload = {
      question: document.getElementById('question').value.trim(),
      answer: document.getElementById('answer').value.trim(),
      category: document.getElementById('category').value.trim(),
      sort_order: Number(document.getElementById('sort_order').value) || 0,
      status: document.getElementById('status').value
    };

    const url = editingId
      ? `${API_BASE}/faqs/admin/${editingId}`
      : `${API_BASE}/faqs/admin`;

    const method = editingId ? 'PUT' : 'POST';

    const res = await fetch(url,{
      method,
      headers:{
        'Content-Type':'application/json',
        Authorization:`Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(!res.ok || !data.success){
      throw new Error(data.message || 'Failed to save FAQ');
    }

    faqModal.hide();

    await loadFaqs();

    alert(editingId ? 'FAQ updated successfully' : 'FAQ created successfully');

  }catch(err){
    console.error(err);
    alert(err.message || 'Save failed');
  }finally{
    saveBtn.disabled = false;
  }
});

async function deleteFaq(id){

  const faq = faqs.find(f=>f.id==id);

  if(!faq) return;

  if(!confirm(`Delete FAQ: "${faq.question}"?`)) return;

  try{

    const res = await fetch(`${API_BASE}/faqs/admin/${id}`,{
      method:'DELETE',
      headers:{ Authorization:`Bearer ${token}` }
    });

    const data = await res.json();

    if(!res.ok || !data.success){
      throw new Error(data.message || 'Delete failed');
    }

    await loadFaqs();

    alert('FAQ deleted successfully');

  }catch(err){
    console.error(err);
    alert(err.message || 'Delete failed');
  }
}

function logout(){
  localStorage.removeItem('adminToken');
  window.location.href='login.html';
}

loadFaqs();

</script>

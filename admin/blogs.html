<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE = 'http://localhost:5000/api';
const token = localStorage.getItem('adminToken');
let blogs = [];

if (!token) window.location.href = 'login.html';

const modal = new bootstrap.Modal(document.getElementById('blogModal'));



async function loadBlogs() {
  try {
    const res = await fetch(`${API_BASE}/admin/blogs`, {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Failed to load blog posts');
    }

    blogs = data.blogs || [];
    renderBlogs(blogs);

  } catch (error) {
    console.error('BLOG LOAD ERROR:', error);

    document.getElementById('blogsTable').innerHTML =
      '<tr><td colspan="7" class="text-center text-danger">' +
      'Could not load blog posts. Check the connection and try again.' +
      '</td></tr>';
  }
}




function renderBlogs(list) {
  const tbody = document.getElementById('blogsTable');

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center">No blog posts found</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(b => `
    <tr>
     <td><img src="${b.featured_image ? `${API_BASE.replace('/api', '')}${b.featured_image}` : 'https://via.placeholder.com/72'}" alt=""></td>
      <td>
        <div class="fw-semibold">${b.title}</div>
        <small class="text-muted">${b.slug}</small>
      </td>
      <td>${b.category || '-'}</td>
      <td><span class="badge ${b.status==='published'?'bg-success':'bg-secondary'}">${b.status || 'draft'}</span></td>
      <td>${b.featured==1? '<span class="badge bg-warning text-dark">Yes</span>' : 'No'}</td>
      <td>${b.created_at ? new Date(b.created_at).toLocaleDateString() : '-'}</td>
      <td class="text-end">
        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${b.id})">
          <i class="fa fa-edit"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteBlog(${b.id})">
          <i class="fa fa-trash"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

let uploadedFeaturedImage = '';

document.getElementById('coverFile').addEventListener('change', async function(){
  const file = this.files[0];
  const preview = document.getElementById('coverPreview');

  if (!file) {
    uploadedFeaturedImage = '';
    preview.style.display = 'none';
    return;
  }

  // Show local preview immediately
  const reader = new FileReader();

  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'inline-block';
  };

  reader.readAsDataURL(file);

  // Upload image to backend
  try {
    const formData = new FormData();
    formData.append('image', file);

    const response = await fetch(`${API_BASE}/blog-uploads`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`
      },
      body: formData
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || 'Image upload failed.');
    }

    uploadedFeaturedImage = data.imageUrl;

    console.log('BLOG IMAGE UPLOADED:', uploadedFeaturedImage);

  } catch (error) {
    console.error('BLOG IMAGE UPLOAD ERROR:', error);

    uploadedFeaturedImage = '';

    alert(
      'Blog image upload failed: ' +
      error.message
    );
  }
});

function openCreateModal(){
  document.getElementById('modalTitle').textContent='New Blog Post';
  document.getElementById('blogForm').reset();
  document.getElementById('blogId').value='';
  document.getElementById('coverPreview').style.display='none';
}

function openEditModal(id){
  const b = blogs.find(x=>x.id==id);
  if(!b) return;

  document.getElementById('modalTitle').textContent='Edit Blog Post';
  document.getElementById('blogId').value = b.id;
  document.getElementById('title').value = b.title;
  document.getElementById('slug').value = b.slug;
  document.getElementById('category').value = b.category || '';
  document.getElementById('author').value = b.author || 'COCOABRIDGE Ltd';
  document.getElementById('status').value = b.status || 'draft';
  document.getElementById('featured').checked = b.featured==1;
  document.getElementById('excerpt').value = b.excerpt || '';
  document.getElementById('content').value = b.content || '';
  document.getElementById('tags').value = b.tags || '';

  const preview = document.getElementById('coverPreview');
  if(b.cover_image || b.image_url){
    preview.src = b.cover_image || b.image_url;
    preview.style.display='inline-block';
  }else{
    preview.style.display='none';
  }

  modal.show();
}

function logout(){
  localStorage.clear();
  window.location.href='login.html';
}


document.getElementById('blogForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const blogId = document.getElementById('blogId').value;

  const payload = {
    title: document.getElementById('title').value.trim(),
    slug: document.getElementById('slug').value.trim(),
    excerpt: document.getElementById('excerpt').value.trim(),
    content: document.getElementById('content').value.trim(),
    featured_image: uploadedFeaturedImage || '',
    author: document.getElementById('author').value.trim(),
    status: document.getElementById('status').value
  };

  try {
    const url = blogId
      ? `${API_BASE}/admin/blogs/${blogId}`
      : `${API_BASE}/admin/blogs`;

    const method = blogId ? 'PUT' : 'POST';

    const response = await fetch(url, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || 'Failed to save blog post.');
    }

    alert(
      blogId
        ? 'Blog post updated successfully.'
        : 'Blog post created successfully.'
    );

    modal.hide();

    await loadBlogs();

  } catch (error) {
    console.error('BLOG SAVE ERROR:', error);

    alert(
      'Failed to save blog post: ' +
      error.message
    );
  }
});


async function deleteBlog(id) {
  if (!confirm('Are you sure you want to delete this blog post? This action cannot be undone.')) {
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/admin/blogs/${id}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || 'Failed to delete blog post.');
    }

    alert('Blog post deleted successfully.');
    await loadBlogs();

  } catch (error) {
    console.error('BLOG DELETE ERROR:', error);
    alert('Failed to delete blog post: ' + error.message);
  }
}

loadBlogs();
</script>

  </div>

<script>

const API_BASE = 'http://localhost:5000/api';

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const form = document.getElementById('inviteForm');
const btn = document.getElementById('acceptBtn');
const msg = document.getElementById('message');


if (!token) {

  form.style.display = 'none';

  msg.className = 'text-danger text-center mt-3';
  msg.textContent = 'Invalid invitation link.';

}


form.addEventListener('submit', async (e) => {

  e.preventDefault();

  const password =
    document.getElementById('password').value;

  const confirmPassword =
    document.getElementById('confirmPassword').value;


  if (password !== confirmPassword) {

    msg.className = 'text-danger text-center mt-3';
    msg.textContent = 'Passwords do not match.';

    return;
  }


  btn.disabled = true;

  btn.innerHTML =
    '<i class="fa fa-spinner fa-spin me-2"></i>Creating account...';

  msg.textContent = '';


  try {

    const response = await fetch(
      `${API_BASE}/admin/invitations/accept`,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          token: token,
          password: password
        })
      }
    );


    const data = await response.json();


    if (data.success) {

      msg.className =
        'text-success text-center mt-3';

      msg.textContent =
        'Account created successfully. Redirecting to login...';


      setTimeout(() => {

        window.location.href = 'login.html';

      }, 2000);


    } else {

      msg.className =
        'text-danger text-center mt-3';

      msg.textContent =
        data.message || 'Unable to create account.';

    }


  } catch (err) {

    console.error(err);

    msg.className =
      'text-danger text-center mt-3';

    msg.textContent =
      'Unable to connect to the server.';


  } finally {

    btn.disabled = false;

    btn.innerHTML =
      '<i class="fa fa-user-check me-2"></i>Create Account';

  }

});

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Manager | COCOABRIDGE Admin</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body{margin:0;background:#f4f6f9;font-family:Segoe UI,Tahoma,sans-serif}
    .sidebar{
      width:260px;height:100vh;position:fixed;left:0;top:0;
      background:#2c1810;color:#fff;padding:24px 18px;overflow-y:auto
    }
    .sidebar h3{color:#f4c542;font-weight:700;margin-bottom:30px}
    .sidebar a{
      display:block;color:#ddd;text-decoration:none;padding:12px 14px;
      border-radius:12px;margin-bottom:6px
    }
    .sidebar a:hover,.sidebar a.active{
      background:rgba(244,197,66,.15);color:#fff
    }
    .main{margin-left:260px;min-height:100vh}
    .topbar{
      background:#fff;padding:18px 28px;border-bottom:1px solid #e5e7eb;
      display:flex;justify-content:space-between;align-items:center;
      position:sticky;top:0;z-index:10
    }
    .content{padding:28px}
    .panel{
      background:#fff;border-radius:18px;padding:22px;
      box-shadow:0 6px 18px rgba(0,0,0,.05)
    }
    .table img{
      width:58px;height:58px;object-fit:cover;border-radius:10px;
      border:1px solid #ddd
    }
    .btn-brand{
      background:#8a5a00;border:none;color:#fff;font-weight:600
    }
    .btn-brand:hover{background:#6f4800;color:#fff}
    .modal-header{background:#2c1810;color:#fff}
    #imagePreview{
      width:140px;height:140px;object-fit:cover;border-radius:14px;
      border:1px solid #ddd;display:none
    }





    /* Scrollable Add/Edit Product form */
.modal-dialog-scrollable .modal-body{
  max-height:70vh;      /* keeps modal inside screen */
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:12px;
}

/* Custom scrollbar */
.modal-dialog-scrollable .modal-body::-webkit-scrollbar{
  width:8px;
}

.modal-dialog-scrollable .modal-body::-webkit-scrollbar-track{
  background:#f1f1f1;
  border-radius:10px;
}

.modal-dialog-scrollable .modal-body::-webkit-scrollbar-thumb{
  background:#8a5a00;
  border-radius:10px;
}

.modal-dialog-scrollable .modal-body::-webkit-scrollbar-thumb:hover{
  background:#6f4800;
}

    @media(max-width:992px){
      .sidebar{position:relative;width:100%;height:auto}
      .main{margin-left:0}
    }
  </style>
</head>

<body>

<aside class="sidebar">
  <h3><i class="fa fa-seedling me-2"></i>COCOABRIDGE</h3>

  <a href="dashboard.html"><i class="fa fa-chart-line me-2"></i>Dashboard</a>
  <a href="products.html" class="active"><i class="fa fa-box me-2"></i>Products</a>
  <a href="blogs.html"><i class="fa fa-newspaper me-2"></i>Blog Posts</a>
  <a href="gallery.html"><i class="fa fa-image me-2"></i>Gallery</a>
  <a href="team.html"><i class="fa fa-users me-2"></i>Team</a>
  <a href="messages.html"><i class="fa fa-envelope me-2"></i>Messages</a>
  <a href="quotes.html"><i class="fa fa-file-invoice-dollar me-2"></i>Quote Requests</a>
  <hr class="border-secondary my-4">
  <a href="#" onclick="logout()"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>
</aside>

<main class="main">

  <div class="topbar">
    <h4 class="mb-0">Products Manager</h4>
    <button class="btn btn-outline-danger" onclick="logout()">
      <i class="fa fa-sign-out-alt me-1"></i>Logout
    </button>
  </div>

  <div class="content">

    <div class="panel">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

        <div class="input-group" style="max-width:320px">
          <span class="input-group-text"><i class="fa fa-search"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
        </div>

        <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openCreateModal()">
          <i class="fa fa-plus me-1"></i>Add Product
        </button>

      </div>

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">
            <tr>
              <th>Image</th>
              <th>Product</th>
              <th>Category</th>
              <th>Status</th>
              <th>Featured</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody id="productsTable">
            <tr><td colspan="6" class="text-center py-4">Loading products...</td></tr>
          </tbody>

        </table>

      </div>
    </div>

  </div>

</main>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Product</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form id="productForm">

        <div class="modal-body">

          <input type="hidden" id="productId">

          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Product Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Slug</label>
              <input type="text" id="slug" class="form-control" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="Cocoa Beans">Cocoa Beans</option>
                <option value="Coffee">Coffee</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select id="status" class="form-select">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check">
                <input type="checkbox" id="featured" class="form-check-input">
                <label class="form-check-label" for="featured">Featured</label>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label">Packaging</label>
              <input type="text" id="packaging" class="form-control">
            </div>

            <div class="col-md-6">
              <label class="form-label">Minimum Order</label>
              <input type="text" id="min_order" class="form-control">
            </div>

            <div class="col-12">
              <label class="form-label">Product Image</label>
              <input type="file" id="imageFile" class="form-control" accept="image/*">
              <small class="text-muted">Select an image from your computer.</small>
            </div>

            <div class="col-12 text-center">
              <img id="imagePreview" alt="Preview">
            </div>





            <div class="col-12">
              <label class="form-label">Short Description</label>
              <textarea id="short_description" class="form-control" rows="2"></textarea>
            </div>

            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="4"></textarea>
            </div>

          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand" id="saveBtn">
            <i class="fa fa-save me-1"></i>Save Product
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE = 'http://localhost:5000/api';
const BACKEND_BASE = 'http://localhost:5000';

const token = localStorage.getItem('adminToken');

let products = [];

if (!token) {
  window.location.href = 'login.html';
}

const modal = new bootstrap.Modal(
  document.getElementById('productModal')
);


/* =========================================================
   IMAGE URL HELPER
   ========================================================= */

function getImageUrl(imagePath) {

  if (!imagePath) {
    return '';
  }

  // Already a complete URL
  if (
    imagePath.startsWith('http://') ||
    imagePath.startsWith('https://') ||
    imagePath.startsWith('data:')
  ) {
    return imagePath;
  }

  // Make sure paths beginning with / are handled correctly
  if (imagePath.startsWith('/')) {
    return BACKEND_BASE + imagePath;
  }

  return BACKEND_BASE + '/' + imagePath;
}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts() {

  try {

    const res = await fetch(`${API_BASE}/admin/products`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    if (!res.ok) {
      throw new Error(`Failed to load products (${res.status})`);
    }

    const data = await res.json();

    if (data.success) {

      products = data.products || [];

      renderProducts(products);

    } else {

      throw new Error(
        data.message || 'Failed to load products'
      );

    }

  } catch (err) {

    console.error('Load products error:', err);

    document.getElementById('productsTable').innerHTML = `
      <tr>
        <td colspan="6" class="text-center text-danger">
          Failed to load products
        </td>
      </tr>
    `;

  }
}


/* =========================================================
   RENDER PRODUCTS
   ========================================================= */

function renderProducts(list) {

  const tbody = document.getElementById('productsTable');

  if (!list.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="text-center">
          No products found
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML = list.map(p => {

    const imageUrl = getImageUrl(p.image_url);


    return `
      <tr>

        <td>

          ${
            imageUrl

              ? `
                <img
                  src="${imageUrl}"
                  alt="${escapeHtml(p.name || 'Product')}"
                  style="
                    width:58px;
                    height:58px;
                    object-fit:cover;
                    border-radius:8px;
                    border:1px solid #ddd;
                  "
                  onerror="this.style.display='none';"
                >
              `

              : `
                <div
                  style="
                    width:58px;
                    height:58px;
                    border-radius:8px;
                    border:1px solid #ddd;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#f5f5f5;
                    color:#999;
                    font-size:11px;
                    text-align:center;
                  "
                >
                  No Image
                </div>
              `
          }

        </td>


        <td>

          <div class="fw-semibold">
            ${escapeHtml(p.name || '')}
          </div>

          <small class="text-muted">
            ${escapeHtml(p.slug || '')}
          </small>

        </td>


        <td>
          ${escapeHtml(p.category || '')}
        </td>


        <td>

          <span class="badge ${
            p.status === 'active'
              ? 'bg-success'
              : 'bg-secondary'
          }">

            ${escapeHtml(p.status || '')}

          </span>

        </td>


        <td>

          ${
            Number(p.featured) === 1

              ? `
                <span class="badge bg-warning text-dark">
                  Yes
                </span>
              `

              : 'No'
          }

        </td>


        <td class="text-end">

          <button
            class="btn btn-sm btn-outline-primary me-1"
            onclick="openEditModal(${p.id})"
          >

            <i class="fa fa-edit"></i>

          </button>


          <button
            class="btn btn-sm btn-outline-danger"
            onclick="deleteProduct(${p.id})"
          >

            <i class="fa fa-trash"></i>

          </button>

        </td>

      </tr>
    `;

  }).join('');
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return '';
  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


/* =========================================================
   SEARCH
   ========================================================= */

document
  .getElementById('searchInput')
  .addEventListener('input', function(e) {

    const q = e.target.value
      .toLowerCase()
      .trim();


    if (!q) {

      renderProducts(products);

      return;
    }


    const filtered = products.filter(p => {

      return (

        (p.name || '')
          .toLowerCase()
          .includes(q)

        ||

        (p.category || '')
          .toLowerCase()
          .includes(q)

        ||

        (p.slug || '')
          .toLowerCase()
          .includes(q)

      );

    });


    renderProducts(filtered);

  });


/* =========================================================
   IMAGE FILE PREVIEW
   ========================================================= */

document
  .getElementById('imageFile')
  .addEventListener('change', function() {

    const file = this.files[0];

    const preview =
      document.getElementById('imagePreview');


    if (!file) {

      preview.src = '';

      preview.style.display = 'none';

      return;
    }


    if (!file.type.startsWith('image/')) {

      alert('Please select a valid image file.');

      this.value = '';

      preview.src = '';

      preview.style.display = 'none';

      return;
    }


    const reader = new FileReader();


    reader.onload = function(e) {

      preview.src = e.target.result;

      preview.style.display = 'inline-block';

    };


    reader.readAsDataURL(file);

  });







/* =========================================================
   OPEN CREATE MODAL
   ========================================================= */

function openCreateModal() {

  document.getElementById('modalTitle').textContent =
    'Add Product';


  document
    .getElementById('productForm')
    .reset();


  document.getElementById('productId').value = '';


  const preview =
    document.getElementById('imagePreview');


  preview.src = '';

  preview.style.display = 'none';


  modal.show();

}


/* =========================================================
   OPEN EDIT MODAL
   ========================================================= */

function openEditModal(id) {

  const product =
    products.find(p => Number(p.id) === Number(id));


  if (!product) {

    alert('Product not found.');

    return;
  }


  document.getElementById('modalTitle').textContent =
    'Edit Product';


  document.getElementById('productId').value =
    product.id;


  document.getElementById('name').value =
    product.name || '';


  document.getElementById('slug').value =
    product.slug || '';


  document.getElementById('category').value =
    product.category || 'Cocoa Beans';


  document.getElementById('status').value =
    product.status || 'active';


  document.getElementById('featured').checked =
    Number(product.featured) === 1;


  document.getElementById('packaging').value =
    product.packaging || '';


  document.getElementById('min_order').value =
    product.min_order || '';


  document.getElementById('short_description').value =
    product.short_description || '';


  document.getElementById('description').value =
    product.description || '';


  // Clear file input.
  // User only uploads a new image if they want to replace
  // the existing one.

  document.getElementById('imageFile').value = '';


  const preview =
    document.getElementById('imagePreview');


  if (product.image_url) {

    preview.src =
      getImageUrl(product.image_url);

    preview.style.display =
      'inline-block';

  } else {

    preview.src = '';

    preview.style.display =
      'none';

  }


  modal.show();

}


/* =========================================================
   UPLOAD PRODUCT IMAGE
   ========================================================= */

async function uploadImage() {

  const fileInput =
    document.getElementById('imageFile');


  // No new image selected.
  // This is important when editing an existing product.

  if (
    !fileInput ||
    !fileInput.files ||
    !fileInput.files.length
  ) {

    return null;

  }


  const file =
    fileInput.files[0];


  if (!file.type.startsWith('image/')) {

    throw new Error(
      'Please select a valid image file.'
    );

  }


  const formData =
    new FormData();


  formData.append(
    'image',
    file
  );


  const response =
    await fetch(
      `${API_BASE}/uploads`,
      {
        method: 'POST',

        headers: {
          Authorization:
            `Bearer ${token}`
        },

        body: formData
      }
    );


  const contentType =
    response.headers.get('content-type') || '';


  if (!contentType.includes('application/json')) {

    const text =
      await response.text();

    console.error(
      'Upload returned non-JSON:',
      text
    );

    throw new Error(
      `Image upload failed (${response.status})`
    );

  }


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.message ||
      'Image upload failed'
    );

  }


  /*
    Your backend should return imageUrl.

    Example:
    /uploads/products/filename.jpg
  */

  if (!data.imageUrl) {

    throw new Error(
      'Image uploaded but the server did not return an image URL.'
    );

  }


  return data.imageUrl;

}






/* =========================================================
   SAVE / CREATE / UPDATE PRODUCT
   ========================================================= */

document
  .getElementById('productForm')
  .addEventListener('submit', async function(e) {

    e.preventDefault();


    try {

      const id =
        document
          .getElementById('productId')
          .value
          .trim();


      /*
        IMPORTANT:

        Only upload a new image when the user selected one.

        When editing without selecting an image,
        we preserve the existing image_url.
      */

      let imageUrl = null;


      const fileInput =
        document.getElementById('imageFile');


      if (
        fileInput.files &&
        fileInput.files.length
      ) {

        imageUrl =
          await uploadImage();

      }







      const payload = {

        name:
          document
            .getElementById('name')
            .value
            .trim(),

        slug:
          document
            .getElementById('slug')
            .value
            .trim(),

        category:
          document
            .getElementById('category')
            .value,

        short_description:
          document
            .getElementById('short_description')
            .value
            .trim(),

        description:
          document
            .getElementById('description')
            .value
            .trim(),

        packaging:
          document
            .getElementById('packaging')
            .value
            .trim(),

        min_order:
          document
            .getElementById('min_order')
            .value
            .trim(),

        featured:
          document
            .getElementById('featured')
            .checked
              ? 1
              : 0,

        status:
          document
            .getElementById('status')
            .value

      };


      /*
        ONLY send image_url when:

        1. Creating a new product and an image was uploaded
        OR
        2. Editing and a replacement image was uploaded
      */

      if (imageUrl) {

        payload.image_url =
          imageUrl;

      }





      const url = id

        ? `${API_BASE}/admin/products/${id}`

        : `${API_BASE}/admin/products`;


      const method =
        id
          ? 'PUT'
          : 'POST';


      const res =
        await fetch(
          url,
          {
            method,

            headers: {

              'Content-Type':
                'application/json',

              Authorization:
                `Bearer ${token}`

            },

            body:
              JSON.stringify(payload)

          }
        );


      const contentType =
        res.headers.get('content-type') || '';


      if (!contentType.includes('application/json')) {

        const text =
          await res.text();

        console.error(
          'Product API returned non-JSON:',
          text
        );

        throw new Error(
          `Server returned an unexpected response (${res.status})`
        );

      }


      const data =
        await res.json();


      if (!res.ok || !data.success) {

        throw new Error(
          data.message ||
          'Product operation failed'
        );

      }


      modal.hide();


      await loadProducts();


      alert(
        id
          ? 'Product updated successfully'
          : 'Product created successfully'
      );


      // Clear form after successful operation

      document
        .getElementById('productForm')
        .reset();


      document
        .getElementById('productId')
        .value = '';


      document
        .getElementById('imagePreview')
        .style.display = 'none';


    } catch (err) {

      console.error(
        'Product save error:',
        err
      );

      alert(
        err.message ||
        'Something went wrong while saving the product.'
      );

    }

  });


/* =========================================================
   DELETE PRODUCT
   ========================================================= */

async function deleteProduct(id) {

  if (
    !confirm(
      'Are you sure you want to delete this product?'
    )
  ) {

    return;
  }


  try {

    const res =
      await fetch(
        `${API_BASE}/admin/products/${id}`,
        {
          method: 'DELETE',

          headers: {
            Authorization:
              `Bearer ${token}`
          }
        }
      );


    const contentType =
      res.headers.get('content-type') || '';


    if (!contentType.includes('application/json')) {

      const text =
        await res.text();

      console.error(
        'Delete returned non-JSON:',
        text
      );

      throw new Error(
        `Delete failed (${res.status})`
      );

    }


    const data =
      await res.json();


    if (!res.ok || !data.success) {

      throw new Error(
        data.message ||
        'Delete failed'
      );

    }


    await loadProducts();


    alert(
      'Product deleted successfully'
    );


  } catch (err) {

    console.error(
      'Delete product error:',
      err
    );

    alert(
      err.message ||
      'Failed to delete product.'
    );

  }

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

  localStorage.removeItem('adminToken');

  window.location.href =
    'login.html';

}


/* =========================================================
   START
   ========================================================= */

loadProducts();

</script>





</body>
</html>

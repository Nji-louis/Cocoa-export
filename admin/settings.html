<script>

const logoFile = document.getElementById('logoFile');
const logoPreview = document.getElementById('logoPreview');
const feedback = document.getElementById('feedback');

let uploadedLogoUrl = '';

logoFile.addEventListener('change', async e => {
  const file = e.target.files[0];

  if (!file) return;

  // Show preview immediately
  logoPreview.src = URL.createObjectURL(file);

  const formData = new FormData();
  formData.append('logo', file);

  try {
    showFeedback('Uploading logo...', 'info');

    const res = await fetch(`${API_BASE}/logo-upload`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`
      },
      body: formData
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Logo upload failed');
    }

    uploadedLogoUrl = data.logoUrl;

    // Display uploaded logo from backend
    logoPreview.src = `${API_BASE.replace('/api', '')}${uploadedLogoUrl}`;

    showFeedback('Logo uploaded successfully.', 'success');

  } catch (err) {
    console.error(err);
    showFeedback(err.message || 'Logo upload failed', 'danger');
  }
});

function showFeedback(message, type='success'){
  feedback.className = `alert alert-${type}`;
  feedback.textContent = message;
}


const API_BASE = 'http://localhost:5000/api';
const token = localStorage.getItem('adminToken');

if (!token) {
  window.location.href = 'login.html';
}

async function loadSettings(){
  try{
    const res = await fetch(`${API_BASE}/settings`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    const data = await res.json();

    if(data.success){
      const s = data.settings;

      document.getElementById('company_name').value = s.company_name || '';
      document.getElementById('email').value = s.email || '';
      document.getElementById('phone').value = s.phone || '';
      document.getElementById('address').value = s.address || '';
      document.getElementById('website').value = s.website || '';

      document.getElementById('facebook_url').value = s.facebook_url || '';
document.getElementById('linkedin_url').value = s.linkedin_url || '';
document.getElementById('instagram_url').value = s.instagram_url || '';
document.getElementById('whatsapp_url').value = s.whatsapp_url || '';
document.getElementById('twitter_url').value = s.twitter_url || '';

      if (s.logo_url) {
  logoPreview.src = s.logo_url.startsWith('http')
    ? s.logo_url
    : `${API_BASE.replace('/api', '')}${s.logo_url}`;
}
    }else{
      showFeedback(data.message || 'Failed to load settings','danger');
    }
  }catch(err){
    console.error(err);
    showFeedback('Server connection failed','danger');
  }
}

document.getElementById('settingsForm').addEventListener('submit', async e => {
  e.preventDefault();

  const payload = {
    company_name: document.getElementById('company_name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    website: document.getElementById('website').value,
    logo_url: uploadedLogoUrl,
    facebook_url: document.getElementById('facebook_url').value.trim(),
    linkedin_url: document.getElementById('linkedin_url').value.trim(),
instagram_url: document.getElementById('instagram_url').value.trim(),
whatsapp_url: document.getElementById('whatsapp_url').value.trim(),
twitter_url: document.getElementById('twitter_url').value.trim(),
  };

  try{
    const res = await fetch(`${API_BASE}/settings`, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        Authorization:`Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.success){
      showFeedback('Settings updated successfully','success');
    }else{
      showFeedback(data.message || 'Failed to save settings','danger');
    }
  }catch(err){
    console.error(err);
    showFeedback('Server connection failed','danger');
  }
});

function logout(){
  localStorage.clear();
  window.location.href='login.html';
}

loadSettings();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | COCOABRIDGE Admin</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body{margin:0;background:#f4f6f9;font-family:Segoe UI,Tahoma,sans-serif}

    .sidebar{
      width:260px;height:100vh;position:fixed;left:0;top:0;
      background:#2c1810;color:#fff;padding:24px 18px;overflow-y:auto
    }

    .sidebar h3{color:#f4c542;font-weight:700;margin-bottom:30px}

    .sidebar a{
      display:block;color:#ddd;text-decoration:none;padding:12px 14px;
      border-radius:12px;margin-bottom:6px
    }

    .sidebar a:hover,.sidebar a.active{
      background:rgba(244,197,66,.15);color:#fff
    }

    .main{margin-left:260px;min-height:100vh}

    .topbar{
      background:#fff;padding:18px 28px;border-bottom:1px solid #e5e7eb;
      display:flex;justify-content:space-between;align-items:center;
      position:sticky;top:0;z-index:10
    }

    .content{padding:28px}

    .stat-card{
      background:#fff;border-radius:18px;padding:22px;
      box-shadow:0 6px 18px rgba(0,0,0,.05);
      border-left:5px solid #8a5a00
    }

    .stat-card h3{margin:0;font-weight:700;color:#2c1810}
    .stat-card p{margin:6px 0 0;color:#6b7280}

    .panel{
      background:#fff;border-radius:18px;padding:22px;
      box-shadow:0 6px 18px rgba(0,0,0,.05)
    }

    .btn-brand{
      background:#8a5a00;border:none;color:#fff;font-weight:600
    }

    .btn-brand:hover{background:#6f4800;color:#fff}

    .table td,.table th{vertical-align:middle}

    .message-preview{
      max-width:320px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }

    .badge-new{background:#dc3545}
    .badge-read{background:#198754}

    .modal-header{background:#2c1810;color:#fff}

    .message-body{
      white-space:pre-wrap;
      line-height:1.7
    }

    @media(max-width:992px){
      .sidebar{position:relative;width:100%;height:auto}
      .main{margin-left:0}
    }
  </style>
</head>

<body>

<aside class="sidebar">
  <h3><i class="fa fa-seedling me-2"></i>COCOABRIDGE</h3>

  <a href="dashboard.html"><i class="fa fa-chart-line me-2"></i>Dashboard</a>
  <a href="products.html"><i class="fa fa-box me-2"></i>Products</a>
  <a href="blogs.html"><i class="fa fa-newspaper me-2"></i>Blog Posts</a>
  <a href="gallery.html"><i class="fa fa-image me-2"></i>Gallery</a>
  <a href="team.html"><i class="fa fa-users me-2"></i>Team</a>
  <a href="messages.html" class="active"><i class="fa fa-envelope me-2"></i>Messages</a>
  <a href="quotes.html"><i class="fa fa-file-invoice-dollar me-2"></i>Quote Requests</a>

  <hr class="border-secondary my-4">

  <a href="#" onclick="logout()"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>
</aside>

<main class="main">

  <div class="topbar">
    <h4 class="mb-0">Contact Messages</h4>

    <button class="btn btn-outline-danger" onclick="logout()">
      <i class="fa fa-sign-out-alt me-1"></i>Logout
    </button>
  </div>

  <div class="content">

    <div class="row g-4 mb-4">

      <div class="col-md-4">
        <div class="stat-card">
          <h3 id="totalCount">0</h3>
          <p>Total Messages</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="stat-card">
          <h3 id="newCount">0</h3>
          <p>New Messages</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="stat-card">
          <h3 id="readCount">0</h3>
          <p>Read Messages</p>
        </div>
      </div>

    </div>

    <div class="panel">

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

        <div class="input-group" style="max-width:340px">
          <span class="input-group-text"><i class="fa fa-search"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search messages...">
        </div>

      </div>

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">
            <tr>
              <th>Sender</th>
              <th>Email</th>
              <th>Subject</th>
              <th>Message</th>
              <th>Status</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody id="messagesTable">
            <tr><td colspan="7" class="text-center py-4">Loading messages...</td></tr>
          </tbody>

        </table>

      </div>

    </div>

  </div>

</main>

<!-- View Message Modal -->
<div class="modal fade" id="messageModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Message Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <strong>Name:</strong>
          <div id="viewName"></div>
        </div>

        <div class="mb-3">
          <strong>Email:</strong>
          <div id="viewEmail"></div>
        </div>

        <div class="mb-3">
          <strong>Subject:</strong>
          <div id="viewSubject"></div>
        </div>

        <div class="mb-3">
          <strong>Date:</strong>
          <div id="viewDate"></div>
        </div>

        <hr>

        <div>
          <strong>Message:</strong>
          <div class="message-body mt-2" id="viewMessage"></div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE = 'http://localhost:5000/api';
const token = localStorage.getItem('adminToken');
let messages = [];

if(!token) window.location.href='login.html';

const modal = new bootstrap.Modal(document.getElementById('messageModal'));

async function loadMessages(){
  const res = await fetch(`${API_BASE}/admin/messages`,{
    headers:{ Authorization:`Bearer ${token}` }
  });

  const data = await res.json();

  if(data.success){
    messages = data.messages || [];
    renderMessages(messages);
    updateStats();
  }
}

function updateStats(){
  document.getElementById('totalCount').textContent = messages.length;
  document.getElementById('newCount').textContent =
    messages.filter(m=>m.status==='new').length;
  document.getElementById('readCount').textContent =
    messages.filter(m=>m.status==='read').length;
}

function renderMessages(list){
  const tbody = document.getElementById('messagesTable');

  if(!list.length){
    tbody.innerHTML='<tr><td colspan="7" class="text-center">No messages found</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(m=>`
    <tr>
      <td>
        <div class="fw-semibold">${m.name || '-'}</div>
        <small class="text-muted">${m.phone || ''}</small>
      </td>
      <td>${m.email || '-'}</td>
      <td>${m.subject || '-'}</td>
      <td><div class="message-preview">${m.message || ''}</div></td>
      <td>
        <span class="badge ${m.status==='read' ? 'badge-read' : 'badge-new'}">
          ${m.status || 'new'}
        </span>
      </td>
      <td>${m.created_at ? new Date(m.created_at).toLocaleDateString() : '-' }</td>
      <td class="text-end">

        <button class="btn btn-sm btn-outline-primary me-1"
                onclick="viewMessage(${m.id})">
          <i class="fa fa-eye"></i>
        </button>

        <button class="btn btn-sm btn-outline-success me-1"
                onclick="markRead(${m.id})">
          <i class="fa fa-check"></i>
        </button>

        <button class="btn btn-sm btn-outline-danger"
                onclick="deleteMessage(${m.id})">
          <i class="fa fa-trash"></i>
        </button>

      </td>
    </tr>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();

  renderMessages(messages.filter(m=>
    (m.name || '').toLowerCase().includes(q) ||
    (m.email || '').toLowerCase().includes(q) ||
    (m.subject || '').toLowerCase().includes(q)
  ));
});

function viewMessage(id){
  const m = messages.find(x=>x.id==id);
  if(!m) return;

  document.getElementById('viewName').textContent = m.name || '';
  document.getElementById('viewEmail').textContent = m.email || '';
  document.getElementById('viewSubject').textContent = m.subject || '';
  document.getElementById('viewDate').textContent =
    m.created_at ? new Date(m.created_at).toLocaleString() : '';
  document.getElementById('viewMessage').textContent = m.message || '';

  modal.show();
}

async function markRead(id){
  const res = await fetch(`${API_BASE}/admin/messages/${id}/read`,{
    method:'PUT',
    headers:{ Authorization:`Bearer ${token}` }
  });

  const data = await res.json();

  if(data.success){
    loadMessages();
  }else{
    alert(data.message || 'Failed to update status');
  }
}

async function deleteMessage(id){
  if(!confirm('Delete this message?')) return;

  const res = await fetch(`${API_BASE}/admin/messages/${id}`,{
    method:'DELETE',
    headers:{ Authorization:`Bearer ${token}` }
  });

  const data = await res.json();

  if(data.success){
    loadMessages();
  }else{
    alert(data.message || 'Delete failed');
  }
}

function logout(){
  localStorage.clear();
  window.location.href='login.html';
}

loadMessages();
</script>

</body>
</html>

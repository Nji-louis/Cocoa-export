<!doctype html>
<html lang="en">
    <head>
    <meta name="description" content="Source premium Arabica coffee beans from Cameroon through COCOABRIDGE Ltd, with quality review, traceability, export documentation, and international buyer support.">

        <meta charset="utf-8">
        <meta http-equiv="refresh" content="0; url=/arabica-coffee-supplier/">
        <link rel="canonical" href="https://cocoabridge.com/arabica-coffee-supplier/">
        <title>Arabica Coffee Supplier | Cameroon Arabica Exporter</title>
    </head>
    <body>
        <p id="coffee-intro">Redirecting to <a href="/arabica-coffee-supplier/">Arabica Coffee Supplier | Cameroon Arabica Exporter</a>.
        </p>


        <script>
async function loadArabica() {
  try {
    const response = await fetch('http://localhost:5000/api/products/arabica-coffee-beans');
    const data = await response.json();

    if (!data.success) return;

    const product = data.product;

    document.getElementById('coffee-title').innerText = product.name;
    document.getElementById('coffee-intro').innerText = product.short_description || '';
    document.getElementById('coffee-origin').innerText = product.origin || 'Cameroon';
    document.getElementById('coffee-packaging').innerText = product.packaging || 'Jute bags';

  } catch (err) {
    console.error(err);
  }
}

loadArabica();
</script>
    </body>
    </html>
